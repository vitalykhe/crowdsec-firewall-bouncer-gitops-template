# This chart does not publish or select a runtime image. Build or choose a
# compatible image, push it to a trusted registry, and pin its digest here.
image:
  repository: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The Secret must be provisioned outside Helm. Never commit the API key.
existingSecret:
  name: ""
  key: api-key

config:
  # Environment-specific CrowdSec LAPI URL, for example:
  # http://crowdsec-service.crowdsec:8080
  apiUrl: ""
  backend: iptables
  updateFrequency: 10s
  denyAction: DROP
  denyLog: true
  disableIPv4: false
  disableIPv6: false
  supportedDecisionTypes:
    - ban

  iptables:
    chains:
      - INPUT
    ipv4Chains: []
    ipv6Chains: []
    addRuleComments: true
    blacklistsIPv4: crowdsec-blacklists
    blacklistsIPv6: crowdsec6-blacklists
    ipsetType: nethash

  nftables:
    hooks:
      - input
    ipv4:
      enabled: true
      setOnly: false
      table: crowdsec
      chain: crowdsec-chain
      priority: -10
    ipv6:
      enabled: true
      setOnly: false
      table: crowdsec6
      chain: crowdsec6-chain
      priority: -10

metrics:
  enabled: true
  port: 60601
  service:
    enabled: true
    annotations: {}
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 30s

probes:
  startup:
    periodSeconds: 2
    timeoutSeconds: 1
    failureThreshold: 30
  readiness:
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
  liveness:
    periodSeconds: 20
    timeoutSeconds: 1
    failureThreshold: 3

daemonset:
  updateStrategy: RollingUpdate
  terminationGracePeriodSeconds: 30

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  capabilities:
    drop:
      - ALL
    add:
      - NET_ADMIN
      - NET_RAW

nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi
